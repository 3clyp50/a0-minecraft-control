<html>
<head><title>Minecraft</title>
<script type="module" src="/plugins/minecraft_control/webui/config-store.js?v=0.6.1"></script></head>
<body><div x-data><template x-if="$store.minecraftConfig">
<div x-init="$store.minecraftConfig.load(config)">
<template x-if="$store.minecraftConfig.ready"><div>
<label for="minecraft-preset">Models</label>
<select id="minecraft-preset" x-model="config.model_preset">
<option value="" :selected="!config.model_preset">Inherit current chat</option>
<template x-for="name in $store.minecraftConfig.presets" :key="name"><option :value="name" :selected="name === config.model_preset" x-text="name"></option></template>
</select>
<div class="field"><label><input type="checkbox" x-model="config.auto_resume"> Close pause menu automatically</label></div>
<div class="field"><label><input type="checkbox" x-model="config.verify_screenshot"> Verify builds with screenshots</label></div>
<div class="field"><label><input type="checkbox" x-model="config.chat_relay"> In-game requests · @a0</label></div>
</div></template>
</div></template></div></body>
</html>
