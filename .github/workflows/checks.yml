name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-and-ui:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p test_controller.py
      - run: python -m unittest discover -s tests -p test_dependencies.py
      - run: python -m unittest discover -s tests -p test_host.py
      - run: python -m unittest discover -s tests -p test_profiles.py
      - run: python -m unittest discover -s tests -p test_paths.py
      - run: node tests/test_store.mjs
      - run: node tests/test_setup_store.mjs
      - run: node tests/test_config_store.mjs
